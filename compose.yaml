services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: collab_docs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collab_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local_dev_password}@database:5432/collab_docs
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
      LANGUAGETOOL_URL: ${LANGUAGETOOL_URL:-}
      LANGUAGETOOL_LANGUAGE: ${LANGUAGETOOL_LANGUAGE:-en-US}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-60}
    depends_on:
      database:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  postgres_data:
